name: Android Demo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_APP_MODE: demo
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ''

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check TypeScript, lint, and tests
        run: |
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Use stable Android SDK API
        run: |
          python - <<'PY'
          from pathlib import Path

          build_file = Path("android/build.gradle")
          contents = build_file.read_text()
          marker = 'apply plugin: "expo-root-project"'
          if contents.count(marker) != 1:
              raise SystemExit(f"Expected one {marker!r} in {build_file}")

          overrides = 'ext.compileSdkVersion = 36\next.buildToolsVersion = "36.0.0"\n\n'
          build_file.write_text(contents.replace(marker, overrides + marker, 1))
          PY

      - name: Build standalone APK
        run: ./android/gradlew --no-daemon -p android assembleRelease

      - name: Verify APK and application ID
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | grep -F "package: name='ae.dabbetha.demo'"
          sha256sum "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dabbetha-demo-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
